      url: https://people.eecs.berkeley.edu/~keutzer/
    - name: Song Han
      url: https://hanlab.mit.edu/songhan
    - name: Ligeng Zhu
      url: https://lzhu.me/

  paper:
    summary: We unify FP8 precision across RL training and rollout to avoid off-policy numerical mismatch from BF16-train + FP8-rollout, which can destabilize long-horizon RL.
            Achieves up to 33% rollout speedup, 41% training speedup, and 16% end-to-end speedup over BF16 with stable convergence.
    url: https://arxiv.org/abs/2601.14243

  categories: ["quantization", "training"]
  tags: ["FP8 reinforcement learning", "LLM reasoning"]


