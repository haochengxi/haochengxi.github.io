      url: "https://scholar.google.com/citations?user=15X3cioAAAAJ"
    - name: Chenfeng Xu
      url: https://www.chenfengx.com/

  paper:
    summary: We present StreamDiffusionV2, a training-free streaming system that adapts video diffusion models for interactive, low-latency live generation.
            It integrates an SLO-aware batching scheduler, sink-token-guided rolling KV cache, motion-aware noise controller, and scalable pipeline orchestration across denoising steps and network layers.
            Achieves 0.5s time-to-first-frame and up to 58.28 FPS (14B) / 64.52 FPS (1.3B) on 4xH100 without TensorRT or quantization.
    url: https://arxiv.org/abs/2511.07399

  categories: ["inference"]
  tags: ["streaming video generation", "real-time serving system"]


