- title: "Jet-RL: Enabling On-Policy FP8 Reinforcement Learning with Unified Training and Rollout Precision Flow"
  publishedIn:
    name: Arxiv 2026
    date: Jan 2026
    url: "https://arxiv.org/abs/2601.14243"
  authors:
    - name: Haocheng Xi
      url: "#"
    - name: Charlie Ruan
      url: "https://www.charlieruan.com/"
    - name: Peiyuan Liao
    - name: Yujun Lin
      url: https://yujunlin.com/
    - name: Han Cai
      url: https://han-cai.github.io/
    - name: Yilong Zhao
      url: https://happierpig.github.io/
    - name: Shuo Yang
      url: https://andy-yang-1.github.io/
