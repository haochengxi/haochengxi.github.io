    - name: Lvmin Zhang
      url: "https://lllyasviel.github.io/lvmin_zhang/"
    - name: Keting Yang
      url: "https://www.linkedin.com/in/keting-yang"
    - name: Kelly Peng
      url: https://www.linkedin.com/in/kelly-peng-182680256/
