projects:
- name: "Video DeltaNet: A Video-Native Hybrid Attention for Livestream Video Generation"
  website: "https://openvdn.github.io/"
  imageSource: "https://arxiv.org/html/2609.20744v3/figure3.svg"
  imageAlt: "Video DeltaNet architecture combining local softmax attention and bidirectional Video Delta Attention."
  image: "images/vdn_overview.svg"
  role: First Author
  timeline: "Sep 2026"
  repo: "https://github.com/OpenVDN/vdn-minimax-h3"
  url: "https://arxiv.org/abs/2609.20744"
  summary: >-
    We introduce a video-native hybrid attention architecture that combines local softmax attention with bidirectional linear memory. A frame-wise delta rule preserves long-range context, while staged adaptation retains the pretrained model’s capabilities. With eight-step distillation and optimized kernels, VDN-H3 denoises a 14.3-second, 768p video in 6.7 seconds on eight B200 GPUs.
  tags: ["inference"]

- name: "MosaiChunk: Compositing Spatio-Temporal Memory for Autoregressive Video Generation"
  website: "https://mosaichunk.github.io/"
  imageSource: "https://arxiv.org/html/2610.02153v1/teaser.png"
  imageAlt: "MosaiChunk preserves the same cookie when a tin closes and reopens by retrieving historical visual memory."
  image: "images/mosaichunk_overview.png"
  role: Co-Author
  timeline: "Oct 2026"
  repo: "https://github.com/mosaichunk/MosaiChunk"
  url: "https://arxiv.org/abs/2610.02153"
  summary: >-
    We give autoregressive video models persistent visual memory by composing selected historical KV entries across space and time. A lightweight router learns which details to retrieve while the generator stays frozen. At matched memory budgets, MosaiChunk improves revisit consistency over sliding windows and whole-chunk retrieval, preserving objects and scenes when they reappear in long videos.
  tags: ["inference"]

- name: "LeapQuant: Efficient Linear Attention with Accurate Recurrent State Quantization"
  imageSource: "https://arxiv.org/html/2609.38166v1/per-window-quantization-paper.svg"
  imageAlt: "LeapQuant compares per-token state quantization with per-window quantization and buffered high-precision updates."
  image: "images/leapquant_overview.svg"
  role: Co-First Author
  timeline: "Sep 2026"
  url: "https://arxiv.org/abs/2609.38166"
  summary: >-
    We make recurrent-state quantization accurate for linear-attention LLMs without retraining or calibration data. Per-window quantization limits error accumulation, while high-precision Compensator Tokens and residual smoothing handle outliers. Across Qwen, Kimi, and GLM models, 8-bit states retain near-FP32 quality, with average kernel speedups of 2.05–3.70× and a 1.47× end-to-end inference speedup.
  tags: ["quantization", "inference"]

- name: "LoSA: Locality Aware Sparse Attention in Diffusion Language Models"
  image: images/losa_overview.png
  role: First Author
  timeline: "Apr 2026"
  repo: "#"
  url: "https://arxiv.org/abs/2604.12056"
  summary: >-
    We address KV inflation in block-wise diffusion language models by reusing prefix-attention results for stable tokens and computing sparse attention only for active tokens. This reduces the union of KV pages loaded at each denoising step. LoSA reaches up to 4.14× attention speedup on RTX A6000 GPUs while preserving near-dense accuracy.
  tags: ["sparsity", "inference"]

- name: "Flash-KMeans: Fast and Memory-Efficient Exact K-Means"
  image: images/flashkmeans_overview.png
  role: Co-First Author
  timeline: "Mar 2026"
  repo: "https://github.com/svg-project/flash-kmeans"
  url: "https://arxiv.org/abs/2603.09229"
  summary: >-
    We redesign exact k-means around GPU memory traffic and atomic contention. FlashAssign fuses distance computation with online argmin, avoiding the full distance matrix; a sort-inverse update converts scattered atomic writes into localized reductions. On H200 GPUs, Flash-KMeans achieves up to 17.9× end-to-end speedup over the strongest evaluated baselines.
  tags: ["sparsity", "inference"]

- name: "Quant VideoGen: Auto-Regressive Long Video Generation via 2-Bit KV-Cache Quantization"
  image: images/qvg_overview.png
  role: Co-First Author
  timeline: "Feb 2026"
  repo: "https://github.com/svg-project/Quant-VideoGen"
  url: "https://arxiv.org/abs/2602.02958"
  summary: >-
    We compress the growing KV cache of autoregressive video diffusion models with a training-free, 2-bit quantization framework. Semantic-aware smoothing exploits spatiotemporal redundancy, and progressive residual quantization preserves fine detail. Across LongCat Video, HY WorldPlay, and Self Forcing, QVG reduces KV-cache memory by up to 7× with less than 4% end-to-end latency overhead.
  tags: ["quantization", "inference"]

- name: "Jet-RL: Enabling On-Policy FP8 Reinforcement Learning with Unified Training and Rollout Precision Flow"
  image: images/jetrl_overview.png
  role: First Author
  timeline: "Jan 2026"
  repo: "#"
  url: "https://arxiv.org/abs/2601.14243"
  summary: >-
    We identify numerical mismatch between BF16 training and FP8 rollout as a cause of instability in long-horizon reinforcement learning. Jet-RL unifies the FP8 precision flow across both stages to keep optimization stable without inter-step calibration. It delivers up to 33% rollout speedup, 41% training speedup, and 16% end-to-end speedup over BF16.
  tags: ["quantization", "training"]

- name: "StreamDiffusion V2: A Streaming System for Dynamic and Interactive Video Generation"
  website: "https://streamdiffusionv2.github.io/"
  image: images/streamdiffusion_overview.png
  role: Core Contributor
  timeline: "Nov 2025"
  repo: "https://github.com/chenfengxu714/StreamDiffusionV2"
  url: "https://arxiv.org/abs/2511.07399"
  summary: >-
    We build a training-free system for interactive video generation with strict frame deadlines. SLO-aware scheduling, a rolling KV cache, motion-aware noise control, and pipeline parallelism coordinate streaming across GPUs. On four H100s, the system produces its first frame within 0.5 seconds and reaches 58.28 FPS with a 14B model, without TensorRT or quantization.
  tags: ["inference"]

- name: "Sparse VideoGen 2: Accelerate Video Generation with Sparse Attention via Semantic-Aware Permutation"
  website: "https://svg-project.github.io/"
  image: images/svg_2_overview.png
  role: Co-First Author
  timeline: "Feb 2025 - Jun 2025"
  repo: "https://github.com/svg-project/Sparse-VideoGen"
  url: "https://arxiv.org/abs/2505.18875"
  summary: >-
    We cluster and reorder video tokens by semantic similarity so sparse attention can identify important regions accurately and process them as contiguous GPU workloads. Dynamic attention budgets and custom kernels turn this structure into practical acceleration without retraining. SVG2 achieves up to 2.30× speedup on HunyuanVideo and 1.89× on Wan 2.1 while preserving generation quality.
  tags: ["sparsity", "inference"]

- name: "Oscillation-Reduced MXFP4 Training for Vision Transformers"
  repo: "https://github.com/thu-ml/TetraJet-MXFP4Training"
  imageSource: "https://arxiv.org/html/2502.20853v2/Method-LinearLayer.svg"
  imageAlt: "TetraJet linear layer with MXFP4 quantizers for forward and backward computation."
  image: "images/tetrajet_overview.svg"
  role: Co-Author
  timeline: "Feb 2025"
  url: "https://arxiv.org/abs/2502.20853"
  summary: >-
    We introduce TetraJet for MXFP4 training and identify weight oscillation around quantization boundaries as a key source of accuracy loss. Truncation-free scaling and double quantization improve numerical accuracy; an EMA quantizer and adaptive ramping optimizer stabilize training. On vision transformers, these techniques reduce accuracy degradation by more than 50% relative to the evaluated baseline.
  tags: ["quantization", "training"]

- name: "SpargeAttn: Accurate Sparse Attention Accelerating Any Model Inference"
  url: "https://arxiv.org/abs/2502.18137"
  image: images/sparge_overview.png
  role: Contributor
  timeline: "Sep 2024 - Feb 2025"
  repo: "https://github.com/thu-ml/SpargeAttn"
  summary: >-
    We accelerate attention across language, image, and video models using a training-free combination of sparsity and quantization. A first online filter predicts important attention regions and skips unnecessary matrix multiplications. A second, softmax-aware filter removes additional work with no extra filtering overhead, preserving end-to-end model quality across diverse workloads.
  tags: ["sparsity", "inference"]

- name: "QuantSpec: Self-Speculative Decoding with Hierarchical Quantized KV Cache"
  image: images/quantspec_overview.png
  role: Co-First Author
  timeline: "Sep 2024 - Feb 2025"
  repo: "#"
  url: "https://arxiv.org/abs/2502.10424"
  summary: >-
    We accelerate long-context generation through self-speculative decoding with 4-bit draft weights and a hierarchical quantized KV cache. The draft shares the target model’s architecture, keeping proposals accurate while reducing memory traffic. QuantSpec maintains acceptance rates above 90%, achieves up to approximately 2.5× end-to-end speedup, and uses about 1.3× less memory than sparse-cache alternatives.
  tags: ["quantization", "inference"]

- name: "Sparse VideoGen: Accelerating Video Diffusion Transformers with Spatial-Temporal Sparsity"
  website: "https://svg-project.github.io/"
  image: images/svg_overview.png
  role: Co-First Author
  timeline: "Sep 2024 - Feb 2025"
  repo: "https://github.com/svg-project/Sparse-VideoGen"
  url: "https://arxiv.org/abs/2502.01776"
  summary: >-
    We reveal complementary spatial and temporal patterns in video-transformer attention and select the appropriate sparse computation for each head through online profiling. Hardware-aware tensor layouts and custom kernels make these patterns efficient on GPUs. Without retraining, SVG preserves video quality while reaching 2.28× and 2.33× end-to-end speedup on CogVideoX-v1.5 and HunyuanVideo.
  tags: ["sparsity", "inference"]

- name: "NVILA: Efficient Frontier Visual Language Models"
  image: images/vila_overview.png
  role: Contributor
  timeline: "Mar 2024 - Nov 2024"
  repo: "https://github.com/NVlabs/VILA"
  url: "https://arxiv.org/abs/2412.04468"
  summary: >-
    We develop efficient vision-language models with a scale-then-compress design: increase image resolution and video length, then compress visual tokens. Optimizations span training, fine-tuning, and inference while maintaining competitive accuracy on image and video benchmarks. NVILA reduces training cost by 1.9–5.1×, prefill latency by 1.6–2.2×, and decoding latency by 1.2–2.8×.
  tags: ["quantization", "training", "inference"]

- name: "COAT: Compressing Optimizer states and Activations for Memory-Efficient FP8 Training"
  website: "https://nvlabs.github.io/COAT/"
  image: images/coat8_overview.png
  role: First Author
  timeline: "Feb 2024 - Sep 2024"
  repo: https://github.com/NVlabs/COAT
  url: "https://arxiv.org/abs/2410.19313"
  summary: >-
    We reduce the memory footprint of FP8 training beyond matrix multiplication. Dynamic range expansion improves optimizer-state quantization, while mixed-granularity activation quantization reduces saved-activation memory. Across language and vision-language training tasks, COAT provides 1.54× lower end-to-end memory usage and 1.43× training speedup over BF16 with nearly lossless model quality.
  tags: ["quantization", "training"]

- name: "Jetfire: Efficient and Accurate Transformer Pretraining with INT8 Data Flow and Per-Block Quantization"
  image: images/jetfire_overview.png
  role: First Author
  timeline: "Sep 2023 - Jan 2024"
  repo: https://github.com/thu-ml/Jetfire-INT8Training/tree/main
  url: "https://arxiv.org/abs/2403.12422"
  summary: >-
    We keep transformer computations in an INT8 data flow to reduce repeated quantization and memory transfers. Per-block quantization controls numerical error, enabling pretraining accuracy comparable to FP16. For a standard transformer block, Jetfire achieves 1.42× end-to-end training speedup and 1.49× lower memory usage than the FP16 baseline.
  tags: ["quantization", "training"]


- name: "Training Transformers with 4-bit Integers"
  image: images/int4train_overview.png
  role: First Author
  timeline: "Apr 2022 - Dec 2022"
  repo: https://github.com/haochengxi/Train_Transformers_with_INT4
  url: "https://arxiv.org/abs/2306.11987"
  summary: >-
    We enable INT4 matrix multiplication in both forward and backward passes on existing GPUs. A Hadamard quantizer suppresses activation outliers; bit splitting and leverage-score sampling preserve sparse gradient information. The method maintains competitive accuracy across language and vision tasks, with linear operators up to 2.2× faster than FP16 and training accelerated by up to 35.1%.
  tags: ["quantization", "training"]
