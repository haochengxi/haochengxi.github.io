{{ $sectionID := .section.id | default (replace (lower .section.name) " " "-") }}
<section class="container-fluid anchor pb-5 projects-section" id="{{ $sectionID }}" aria-labelledby="{{ $sectionID }}-heading">
  <h1 id="{{ $sectionID }}-heading" class="text-center{{ if .section.hideTitle }} visually-hidden{{ end }}">{{ .section.name }}</h1>
  <div class="container text-center">
    <div class="btn-group flex-wrap" role="group" aria-label="Filter projects" id="project-filter-buttons-{{ $sectionID }}">
      {{ range .buttons }}
        <button type="button" class="btn btn-dark project-filtr-control{{ if eq .filter "all" }} active{{ end }}" data-filter="{{ .filter }}" aria-pressed="{{ if eq .filter "all" }}true{{ else }}false{{ end }}" aria-controls="project-card-holder-{{ $sectionID }}">{{ .name }}</button>
      {{ end }}
    </div>
  </div>
  <div class="container project-grid" id="project-card-holder-{{ $sectionID }}">
    {{ range .projects }}{{ partial "cards/project" . }}{{ end }}
  </div>
</section>
